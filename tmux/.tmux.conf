# My TMUX Config -- Install tpm first
# Run Prefix + (Shift + I) from a tmux session to reload 
set -g default-terminal "tmux-256color"
set -gq utf8 on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-sidebar'


set -g @continuum-restore 'on'
set -g set-clipboard on

# https://github.com/eza-community/eza
# sudo apt install eza
set -g @sidebar-tree-command 'eza --tree --icons=always --color=always --level=3 --git-ignore -I "__pycache__|node_modules|.git"'
set -g @sidebar-tree-pager 'less -RS'

run '~/.tmux/plugins/tpm/tpm'
